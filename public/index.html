<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ghost Form | Privacy-First Form Backend</title>
  <style>
    :root {
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --primary: #6366f1; /* Indigo gradient base */
      --primary-hover: #4f46e5;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --radius: 16px; /* 16dp rounded corners */
    }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
    }
    .container {
      background: var(--card-bg);
      padding: 48px;
      border-radius: var(--radius);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.04);
      width: 100%;
      max-width: 480px;
      text-align: center;
    }
    
    /* Logo and Title Styling */
    .brand-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 8px;
    }
    .brand-logo {
      width: 48px;
      height: 48px;
      object-fit: contain;
      /* Optional: Add a subtle drop shadow to the logo for premium feel */
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.05));
    }
    h1 { 
      margin: 0; 
      font-size: 28px; 
      letter-spacing: -0.5px; 
      font-weight: 700;
    }
    p { 
      color: var(--text-muted); 
      margin-bottom: 32px; 
      line-height: 1.6; 
      font-size: 15px;
    }
    
    .form-group { margin-bottom: 20px; text-align: left; }
    label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: var(--text-main); }
    input, textarea {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      font-size: 15px;
      transition: all 0.2s ease;
      box-sizing: border-box;
      font-family: inherit;
      background-color: #fafafa;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }
    button {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--primary), var(--primary-hover));
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.2s ease;
    }
    button:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(99, 102, 241, 0.25); }
    button:active { transform: translateY(0); }
    
    .status { margin-top: 16px; font-size: 14px; font-weight: 500; }
    .success { color: #10b981; }
    .error { color: #ef4444; }
  </style>
</head>
<body>
  <div class="container">
    <!-- Updated Brand Header with Logo -->
    <div class="brand-header">
      <img src="images/ghostform.png" alt="Ghost Form Logo" class="brand-logo">
      <h1>Ghost Form</h1>
    </div>
    
    <p>A privacy-first, open-source form backend for static websites.</p>
    
    <form id="testForm">
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required placeholder="John Doe">
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required placeholder="john@example.com">
      </div>
      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="4" required placeholder="Your message here..."></textarea>
      </div>
      <button type="submit">Send Test Submission</button>
    </form>
    <div id="status" class="status"></div>
  </div>

  <script>
    // NOTE: Replace 'test-ghost-form' with your actual generated slug later
    const FORM_SLUG = 'test-ghost-form'; 
    const API_URL = `http://localhost:3000/api/submit/${FORM_SLUG}`;

    document.getElementById('testForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const statusEl = document.getElementById('status');
      statusEl.textContent = 'Sending...';
      statusEl.className = 'status';

      const formData = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        message: document.getElementById('message').value
      };

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(formData)
        });
        const data = await res.json();
        if (data.success) {
          statusEl.textContent = '✅ Successfully received by Ghost Form!';
          statusEl.classList.add('success');
          e.target.reset();
        } else {
          throw new Error(data.error);
        }
      } catch (err) {
        statusEl.textContent = '❌ Error: ' + err.message;
        statusEl.classList.add('error');
      }
    });
  </script>
</body>
</html>
