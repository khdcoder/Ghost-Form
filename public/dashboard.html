<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Ghost Form</title>
  <style>
    :root {
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --radius: 16px;
    }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 40px 24px;
      min-height: 100vh;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
      flex-wrap: wrap;
      gap: 16px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-logo { width: 40px; height: 40px; object-fit: contain; }
    h1 { margin: 0; font-size: 24px; font-weight: 700; }
    
    .btn {
      padding: 12px 24px;
      background: linear-gradient(135deg, var(--primary), var(--primary-hover));
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(99, 102, 241, 0.25); }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
    }
    .btn-outline:hover { background: #f1f5f9; box-shadow: none; }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.04);
      overflow: hidden;
    }
    
    /* Table Styling */
    .table-container { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th {
      text-align: left;
      padding: 16px 24px;
      background: #f8fafc;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border-color);
    }
    td {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border-color);
      font-size: 14px;
      color: var(--text-main);
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #fafbfc; }
    
    .empty-state {
      padding: 64px 24px;
      text-align: center;
      color: var(--text-muted);
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      background: #ecfdf5;
      color: #059669;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="brand">
        <img src="images/ghostform.png" alt="Logo" class="brand-logo">
        <div>
          <h1>Dashboard</h1>
          <span style="font-size: 14px; color: var(--text-muted);">Form: test-ghost-form</span>
        </div>
      </div>
      <div style="display: flex; gap: 12px;">
        <button class="btn btn-outline" onclick="exportToCSV()">📥 Export CSV</button>
        <a href="/" class="btn btn-outline">← Back to Form</a>
      </div>
    </div>

    <div class="card">
      <div class="table-container">
        <table id="submissionsTable">
          <thead>
            <tr>
              <th>Date</th>
              <th>Name</th>
              <th>Email</th>
              <th>Message</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr>
              <td colspan="5" class="empty-state">Loading submissions...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const FORM_SLUG = 'test-ghost-form';
    let submissionsData = [];

    async function loadSubmissions() {
      try {
        const res = await fetch(`http://localhost:3000/api/submissions/${FORM_SLUG}`);
        const data = await res.json();
        
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        if (!data.success || data.submissions.length === 0) {
          tbody.innerHTML = `<tr><td colspan="5" class="empty-state">No submissions found yet. Try submitting the form first!</td></tr>`;
          return;
        }

        submissionsData = data.submissions;

        submissionsData.forEach(sub => {
          const date = new Date(sub.createdAt).toLocaleString();
          const rowData = sub.data; // JSON data from form
          
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td style="color: var(--text-muted); font-size: 13px;">${date}</td>
            <td><strong>${rowData.name || 'N/A'}</strong></td>
            <td>${rowData.email || 'N/A'}</td>
            <td style="max-width: 300px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${rowData.message || 'N/A'}</td>
            <td><span class="badge">Received</span></td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        document.getElementById('tableBody').innerHTML = `<tr><td colspan="5" class="empty-state" style="color: #ef4444;">Error loading data. Is the server running?</td></tr>`;
      }
    }

    function exportToCSV() {
      if (submissionsData.length === 0) {
        alert("No data to export!");
        return;
      }
      
      // CSV Header
      let csvContent = "Date,Name,Email,Message,IP Address\n";
      
      // CSV Rows
      submissionsData.forEach(sub => {
        const date = new Date(sub.createdAt).toLocaleString().replace(/,/g, '');
        const name = (sub.data.name || '').replace(/,/g, ' ');
        const email = sub.data.email || '';
        const message = (sub.data.message || '').replace(/,/g, ' ').replace(/\n/g, ' ');
        const ip = sub.ipAddress || 'Unknown';
        
        csvContent += `${date},${name},${email},${message},${ip}\n`;
      });

      // Download Trigger
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      const url = URL.createObjectURL(blob);
      link.setAttribute("href", url);
      link.setAttribute("download", `ghost-form-submissions-${FORM_SLUG}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // Load data on page load
    loadSubmissions();
  </script>
</body>
</html>
