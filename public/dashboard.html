<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Ghost Form</title>
  <style>
    :root {
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --success: #10b981;
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 40px 24px;
      min-height: 100vh;
    }
    .container { max-width: 1000px; margin: 0 auto; }
    
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
      flex-wrap: wrap;
      gap: 16px;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-logo { width: 40px; height: 40px; object-fit: contain; }
    h1 { margin: 0; font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 14px; color: var(--text-muted); }
    
    .btn {
      padding: 12px 24px;
      background: linear-gradient(135deg, var(--primary), var(--primary-hover));
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: inherit;
    }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(99, 102, 241, 0.25); }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
    }
    .btn-outline:hover { background: #f1f5f9; box-shadow: none; }
    .btn-sm { padding: 8px 16px; font-size: 13px; }

    /* Form Selector Card */
    .selector-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.04);
      margin-bottom: 24px;
    }
    .selector-row {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    .selector-label {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      margin-right: 8px;
    }
    select {
      flex: 1;
      min-width: 200px;
      padding: 12px 16px;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      font-size: 14px;
      font-family: inherit;
      background: white;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }
    
    /* Endpoint Display */
    .endpoint-box {
      margin-top: 16px;
      padding: 14px 18px;
      background: #f8fafc;
      border: 1px dashed var(--border-color);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .endpoint-url {
      font-family: 'Courier New', monospace;
      font-size: 13px;
      color: var(--text-main);
      word-break: break-all;
      flex: 1;
    }
    .endpoint-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    /* Table Card */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.04);
      overflow: hidden;
    }
    .table-container { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th {
      text-align: left;
      padding: 16px 24px;
      background: #f8fafc;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border-color);
    }
    td {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border-color);
      font-size: 14px;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #fafbfc; }
    
    .empty-state {
      padding: 64px 24px;
      text-align: center;
      color: var(--text-muted);
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      background: #ecfdf5;
      color: #059669;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .badge-count {
      background: #eef2ff;
      color: var(--primary);
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 700;
      margin-left: 6px;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 24px;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: white;
      border-radius: var(--radius);
      padding: 32px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
      animation: slideUp 0.3s ease;
    }
    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .modal h2 { margin: 0 0 8px 0; font-size: 22px; }
    .modal p { color: var(--text-muted); margin: 0 0 24px 0; font-size: 14px; }
    .form-group { margin-bottom: 20px; }
    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .form-group input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      font-size: 15px;
      font-family: inherit;
      transition: all 0.2s ease;
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }
    .form-hint {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 6px;
    }
    .modal-actions {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
      margin-top: 24px;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--text-main);
      color: white;
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.3s ease;
      z-index: 200;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="brand">
        <img src="/images/ghostform.png" alt="Logo" class="brand-logo">
        <div>
          <h1>Dashboard</h1>
          <span class="subtitle">Manage all your forms and submissions</span>
        </div>
      </div>
      <div style="display: flex; gap: 12px;">
        <button class="btn" onclick="openModal()">✨ Create New Form</button>
        <a href="/" class="btn btn-outline">← Back to Home</a>
      </div>
    </div>

    <!-- Form Selector -->
    <div class="selector-card">
      <div class="selector-row">
        <span class="selector-label">Select Form:</span>
        <select id="formSelector" onchange="onFormChange()">
          <option value="">Loading forms...</option>
        </select>
        <button class="btn btn-outline btn-sm" onclick="exportToCSV()">📥 Export CSV</button>
      </div>
      <div class="endpoint-box" id="endpointBox" style="display: none;">
        <div style="flex: 1;">
          <div class="endpoint-label">Your Form Endpoint</div>
          <div class="endpoint-url" id="endpointUrl">-</div>
        </div>
        <button class="btn btn-sm" onclick="copyEndpoint()">📋 Copy</button>
      </div>
    </div>

    <!-- Submissions Table -->
    <div class="card">
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Name</th>
              <th>Email</th>
              <th>Message</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr><td colspan="5" class="empty-state">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Create Form Modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <h2>✨ Create New Form</h2>
      <p>Give your form a unique slug. This will generate a unique endpoint URL.</p>
      <div class="form-group">
        <label for="slugInput">Form Slug</label>
        <input type="text" id="slugInput" placeholder="e.g., contact-us, newsletter-signup" oninput="formatSlug(this)">
        <div class="form-hint">Only lowercase letters, numbers, and hyphens allowed.</div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
        <button class="btn" onclick="createForm()">Create Form</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast">Copied!</div>

  <script>
    let allForms = [];
    let submissionsData = [];
    let currentSlug = '';

    // Load all forms on page load
    async function loadForms() {
      try {
        const res = await fetch('/api/forms');
        const data = await res.json();
        
        if (!data.success) throw new Error('Failed to load forms');
        
        allForms = data.forms;
        const selector = document.getElementById('formSelector');
        selector.innerHTML = '';

        if (allForms.length === 0) {
          selector.innerHTML = '<option value="">No forms yet. Create one!</option>';
          document.getElementById('tableBody').innerHTML = `<tr><td colspan="5" class="empty-state">No forms created yet. Click "Create New Form" to get started!</td></tr>`;
          return;
        }

        allForms.forEach(form => {
          const opt = document.createElement('option');
          opt.value = form.slug;
          opt.textContent = `${form.slug} (${form._count.submissions} submissions)`;
          selector.appendChild(opt);
        });

        // Auto-select first form
        currentSlug = allForms[0].slug;
        selector.value = currentSlug;
        updateEndpointDisplay();
        loadSubmissions(currentSlug);
      } catch (err) {
        console.error(err);
      }
    }

    function updateEndpointDisplay() {
      const box = document.getElementById('endpointBox');
      const url = document.getElementById('endpointUrl');
      if (currentSlug) {
        url.textContent = `${window.location.origin}/api/submit/${currentSlug}`;
        box.style.display = 'flex';
      } else {
        box.style.display = 'none';
      }
    }

    function onFormChange() {
      currentSlug = document.getElementById('formSelector').value;
      updateEndpointDisplay();
      if (currentSlug) loadSubmissions(currentSlug);
    }

    async function loadSubmissions(slug) {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '<tr><td colspan="5" class="empty-state">Loading submissions...</td></tr>';
      
      try {
        const res = await fetch(`/api/submissions/${slug}`);
        const data = await res.json();
        
        if (!data.success || data.submissions.length === 0) {
          tbody.innerHTML = `<tr><td colspan="5" class="empty-state">No submissions yet for this form. Share the endpoint URL to start receiving data!</td></tr>`;
          submissionsData = [];
          return;
        }

        submissionsData = data.submissions;
        tbody.innerHTML = '';

        submissionsData.forEach(sub => {
          const date = new Date(sub.createdAt).toLocaleString();
          const rowData = sub.data;
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td style="color: var(--text-muted); font-size: 13px;">${date}</td>
            <td><strong>${rowData.name || 'N/A'}</strong></td>
            <td>${rowData.email || 'N/A'}</td>
            <td style="max-width: 300px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${rowData.message || 'N/A'}</td>
            <td><span class="badge">Received</span></td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="5" class="empty-state" style="color: #ef4444;">Error loading data.</td></tr>`;
      }
    }

    // Modal Controls
    function openModal() {
      document.getElementById('modal').classList.add('active');
      document.getElementById('slugInput').focus();
    }
    function closeModal() {
      document.getElementById('modal').classList.remove('active');
      document.getElementById('slugInput').value = '';
    }

    function formatSlug(input) {
      input.value = input.value
        .toLowerCase()
        .replace(/[^a-z0-9-]/g, '-')
        .replace(/-+/g, '-')
        .replace(/^-|-$/g, '');
    }

    async function createForm() {
      const slug = document.getElementById('slugInput').value.trim();
      if (!slug) {
        showToast('Please enter a slug!');
        return;
      }

      try {
        const res = await fetch('/api/forms', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ slug })
        });
        const data = await res.json();

        if (data.success) {
          showToast('✅ Form created successfully!');
          closeModal();
          loadForms(); // Reload forms list
        } else {
          showToast('❌ ' + (data.error || 'Failed to create form'));
        }
      } catch (err) {
        showToast('❌ Error creating form');
      }
    }

    function copyEndpoint() {
      const url = document.getElementById('endpointUrl').textContent;
      navigator.clipboard.writeText(url).then(() => {
        showToast('📋 Endpoint copied to clipboard!');
      });
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    function exportToCSV() {
      if (!currentSlug || submissionsData.length === 0) {
        showToast('No data to export!');
        return;
      }
      
      let csvContent = "Date,Name,Email,Message,IP Address\n";
      submissionsData.forEach(sub => {
        const date = new Date(sub.createdAt).toLocaleString().replace(/,/g, '');
        const name = (sub.data.name || '').replace(/,/g, ' ');
        const email = sub.data.email || '';
        const message = (sub.data.message || '').replace(/,/g, ' ').replace(/\n/g, ' ');
        const ip = sub.ipAddress || 'Unknown';
        csvContent += `${date},"${name}","${email}","${message}","${ip}"\n`;
      });

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      link.setAttribute("href", URL.createObjectURL(blob));
      link.setAttribute("download", `ghost-form-${currentSlug}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      showToast('📥 CSV downloaded!');
    }

    // Close modal on overlay click
    document.getElementById('modal').addEventListener('click', (e) => {
      if (e.target.id === 'modal') closeModal();
    });

    // Initialize
    loadForms();
  </script>
</body>
</html>
